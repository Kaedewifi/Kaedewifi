<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <!-- watercolor bleed -->
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="10"/>
    </filter>
    <!-- paper grain -->
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0.07 0"/>
    </filter>
    <!-- slightly rough ink edge for antlers -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fa38a"/>
      <stop offset="0.55" stop-color="#b9a46a"/>
      <stop offset="1" stop-color="#d0965f"/>
    </linearGradient>
    <linearGradient id="antler" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3a7b0"/>
      <stop offset="0.6" stop-color="#c98a8f"/>
      <stop offset="1" stop-color="#a87a6e"/>
    </linearGradient>

    <!-- one generic antler branch, drawn pointing right -->
    <g id="branch">
      <path d="M0 0 C40 -4 80 -10 130 -6 C170 -3 200 -14 230 -30
               M60 -6 C66 -30 62 -50 74 -70
               M120 -6 C130 -34 150 -46 152 -72
               M170 -8 C182 -24 205 -20 214 -44"
            fill="none" stroke="url(#antler)" stroke-width="7" stroke-linecap="round"/>
      <path d="M0 0 C40 -4 80 -10 130 -6" fill="none" stroke="#f6e3e4" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    </g>

    <style>
      .sway  { transform-origin: 50% 0; animation: sway 7s ease-in-out infinite; }
      .sway2 { transform-origin: 50% 0; animation: sway 9s ease-in-out infinite reverse; }
      .breathe { animation: breathe 10s ease-in-out infinite; }
      @keyframes sway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
      @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: .8; } }
      .title { font-family: "Cormorant Garamond", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
      .mono  { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="380" fill="#f5f1ea"/>

  <!-- watercolor washes -->
  <g filter="url(#wc)">
    <ellipse class="breathe" cx="230" cy="250" rx="210" ry="120" fill="#f0c9cf" opacity=".6"/>
    <ellipse cx="610" cy="120" rx="260" ry="100" fill="#f3e3a8" opacity=".55"/>
    <ellipse class="breathe" cx="980" cy="260" rx="230" ry="110" fill="#bcd2bd" opacity=".55"/>
    <ellipse cx="850" cy="90" rx="120" ry="60" fill="#ecc3c8" opacity=".45"/>
  </g>
  <rect width="1200" height="380" filter="url(#paper)"/>

  <!-- strings + hanging antlers (left) -->
  <g class="sway">
    <line x1="139" y1="0" x2="139" y2="110" stroke="#9b918a" stroke-width="1" opacity=".7"/>
    <line x1="313" y1="0" x2="313" y2="58"  stroke="#9b918a" stroke-width="1" opacity=".7"/>
    <g filter="url(#ink)" transform="translate(90 120) rotate(-8)">
      <use href="#branch"/>
    </g>
  </g>

  <!-- strings + hanging antlers (right, mirrored) -->
  <g class="sway2">
    <line x1="1061" y1="0" x2="1061" y2="110" stroke="#9b918a" stroke-width="1" opacity=".7"/>
    <line x1="887" y1="0" x2="887" y2="58"  stroke="#9b918a" stroke-width="1" opacity=".7"/>
    <g filter="url(#ink)" transform="translate(1110 120) scale(-1 1) rotate(-8)">
      <use href="#branch"/>
    </g>
  </g>

  <!-- a few loose strings for depth -->
  <g stroke="#9b918a" stroke-width=".7" opacity=".35">
    <line x1="470" y1="0" x2="470" y2="380"/>
    <line x1="730" y1="0" x2="730" y2="300"/>
    <line x1="1000" y1="0" x2="1000" y2="380"/>
  </g>

  <!-- tiny stitch marks like the wrist bands -->
  <g stroke="#b88a6a" stroke-width="2" stroke-linecap="round" opacity=".75">
    <path d="M520 312 l10 10 M530 312 l-10 10  M545 312 l10 10 M555 312 l-10 10  M570 312 l10 10 M580 312 l-10 10"/>
    <path d="M620 312 l10 10 M630 312 l-10 10  M645 312 l10 10 M655 312 l-10 10  M670 312 l10 10 M680 312 l-10 10"/>
  </g>

  <!-- name -->
  <text x="600" y="232" text-anchor="middle" class="title" font-size="96" font-style="italic" fill="url(#name)">Kaede_wifi</text>
  <text x="600" y="276" text-anchor="middle" class="mono" font-size="17" fill="#8a7f78" letter-spacing="3">reversing · esp32 · strings attached</text>
</svg>
